<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"href="styles.css">
    <script src="script.js"defer> </script>
    <title>Dungeons and Dragle</title>
</head>
<body>
    <header>
        <img src="header.jpg" alt = "logo">
        <h1> Dungeons and Dragle </h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about_us.html">About Us</a></li>
                <li><a href="how_to_play.html">How To Play</a></li>
            </ul>
        </nav>
    </header>
    <div class="game-area">
        <div class="monster-image">
            
            <img src ="placeholder.jpg" alt = "This is the monster image.">
        </div>
        <div class="hint-area">
            <div class="type-check">
                <h2>Type</h2>
                <img src ="placeholder.jpg" alt = "This is the Type checker.">
            </div>
            <div class="cr-check">
                <h2>CR</h2>
                <img src ="placeholder.jpg" alt = "This is the CR checker.">
            </div>
            <div class="habitat-check">
                <h2>Habitat</h2>
                <img src ="placeholder.jpg" alt = "This is the Habitat checker.">
            </div>
            <div class="alignment-check">
                <h2>Alignment</h2>
                <img src ="placeholder.jpg" alt = "This is the Alignment checker.">
            </div>
            <div class="hp-check">
                <h2>HP AVG</h2>
                <img src ="placeholder.jpg" alt = "This is the HP checker.">
            </div>
        </div>
        <input type="text">
        <form action="/submit-page" method="POST">
            <button type="submit">Submit Form</button>
        </form>
    </div>
</body>
</html>
